services:
  mcp_server:
    image: danteonline/llm-network-control-mcp-server
    env_file:
      - .env
    expose:
      - "${SERVER_PORT:-9000}"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-9000}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcp_client:
    image: danteonline/llm-network-control-mcp-client
    env_file:
      - .env
    expose:
      - "${CLIENT_PORT:-8000}"
    depends_on:
      mcp_server:
        condition: service_healthy
    command: >
      sh -c "fastapi run --host 0.0.0.0 --port ${CLIENT_PORT:-8000}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${CLIENT_PORT:-8000}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram_bot:
    image: danteonline/llm-network-control-telegram-bot
    build:
      context: .
    env_file:
      - .env
    depends_on:
      mcp_client:
        condition: service_healthy

volumes:
  sqlite_data: